<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign Up - Pawgress</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style> .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; } </style>
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "outline": "#7e766d", "secondary-fixed": "#d4e7d6", "on-secondary": "#ffffff", "on-primary-fixed-variant": "#514535", "primary-fixed": "#f3dfca", "on-background": "#1f1b18", "inverse-on-surface": "#f8efe9", "surface-variant": "#eae1db", "surface-tint": "#6a5c4b", "inverse-surface": "#34302c", "surface-container-lowest": "#ffffff", "tertiary-fixed": "#e7e2dc", "tertiary": "#615e59", "tertiary-fixed-dim": "#cbc6c0", "primary-fixed-dim": "#d6c4af", "surface-container-highest": "#eae1db", "on-tertiary-fixed": "#1d1b18", "on-error-container": "#93000a", "surface-container-low": "#fbf2ec", "on-surface-variant": "#4d463e", "on-tertiary-container": "#6c6864", "surface-container-high": "#efe6e1", "on-secondary-container": "#57695b", "inverse-primary": "#d6c4af", "surface-container": "#f5ece6", "secondary": "#516255", "on-primary-fixed": "#241a0d", "on-primary": "#ffffff", "secondary-container": "#d4e7d6", "primary-container": "#fbe7d1", "primary": "#6a5c4b", "on-surface": "#1f1b18", "error": "#ba1a1a", "secondary-fixed-dim": "#b9cbbb", "error-container": "#ffdad6", "on-tertiary-fixed-variant": "#494642", "on-primary-container": "#756755", "on-secondary-fixed": "#0f1f14", "surface-dim": "#e1d8d3", "tertiary-container": "#efe9e3", "background": "#fff8f4", "on-secondary-fixed-variant": "#3a4b3e", "surface-bright": "#fff8f4", "outline-variant": "#d0c5ba", "on-tertiary": "#ffffff", "surface": "#fff8f4", "on-error": "#ffffff" }, fontFamily: { "h2": ["Plus Jakarta Sans"], "h1": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "h3": ["Plus Jakarta Sans"], "label-caps": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"] } } } }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container relative overflow-hidden">
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/40 blur-[100px] opacity-70"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/30 blur-[120px] opacity-60"></div>
    </div>
    
    <main class="flex-grow flex items-center justify-center px-4 py-12 z-10">
        <div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_8px_40px_rgba(0,0,0,0.04)] p-8 md:p-12 border border-surface-variant/50">
            <div class="mb-2 -mt-4 -ml-2">
                <a class="inline-flex items-center gap-2 px-3 py-2 text-on-surface-variant font-body-md text-sm hover:text-primary transition-colors duration-200 group" href="index.html">
                    <span class="material-symbols-outlined text-[20px] transition-transform duration-200 group-hover:-translate-x-1">arrow_back</span>
                    <span class="font-medium">Back</span>
                </a>
            </div>
            
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-on-primary-container mb-6">
                    <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">spa</span>
                </div>
                <h1 class="font-h2 text-h2 text-on-surface mb-3">Create your account</h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Join the community and start nurturing your habits.</p>
            </div>
            
            <form id="signup-form" class="space-y-6">
                <div class="flex flex-col">
                    <label class="font-label-caps text-label-caps text-on-surface-variant mb-2 ml-1" for="email">Email</label>
                    <div class="relative">
                        <input class="w-full bg-surface-container px-4 py-3.5 border-b-2 border-outline-variant focus:border-primary focus:bg-surface-container-high focus:outline-none rounded-t-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-all duration-300" id="email" required placeholder="hello@example.com" type="email"/>
                    </div>
                </div>
                <div class="flex flex-col">
                    <label class="font-label-caps text-label-caps text-on-surface-variant mb-2 ml-1" for="password">Password</label>
                    <div class="relative">
                        <input class="w-full bg-surface-container px-4 py-3.5 border-b-2 border-outline-variant focus:border-primary focus:bg-surface-container-high focus:outline-none rounded-t-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-all duration-300" id="password" required minlength="6" placeholder="•••••••• (Min 6 chars)" type="password"/>
                    </div>
                </div>
                
                <p id="error-message" class="text-error text-sm hidden font-medium"></p>

                <div class="pt-4">
                    <button id="submit-btn" class="w-full py-4 bg-primary text-on-primary rounded-full font-body-md text-body-md font-medium hover:bg-surface-tint hover:shadow-md active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer" type="submit">
                        Sign Up
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                    </button>
                </div>
            </form>
            
            <div class="mt-8 text-center">
                <p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-medium hover:text-surface-tint hover:underline underline-offset-4 transition-colors duration-200" href="login.html">Log In</a>
                </p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Konfigurasi Firebase dari console
        const firebaseConfig = {
            apiKey: "AIzaSyDoJaDoLgqK0mBqwFlR4IzfOXU5Momw79M",
            authDomain: "pawgress-61f1b.firebaseapp.com",
            projectId: "pawgress-61f1b",
            storageBucket: "pawgress-61f1b.firebasestorage.app",
            messagingSenderId: "961533964015",
            appId: "1:961533964015:web:e8ebc2c592bcf03def751a"
        };

        // Initialize Firebase & Auth
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Ambil elemen HTML
        const signupForm = document.getElementById('signup-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        // Logic saat form disubmit
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Mencegah halaman refresh otomatis
            errorMsg.classList.add('hidden'); // Sembunyikan error sebelumnya
            submitBtn.innerText = "Loading...";

            const email = emailInput.value;
            const password = passwordInput.value;

            // Panggil fungsi daftar Firebase
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Pendaftaran sukses!
                    const user = userCredential.user;
                    console.log("Registered:", user.email);
                    
                    // Bersihkan memory localstorage habit yg lama
                    localStorage.clear();

                    // Pindah ke halaman Onboarding
                    window.location.href = "onboarding.html"; 
                })
                .catch((error) => {
                    // Pendaftaran gagal
                    submitBtn.innerText = "Sign Up";
                    errorMsg.classList.remove('hidden');
                    
                    // Ubah pesan error bawaan supaya lebih manusiawi
                    if(error.code === 'auth/email-already-in-use') {
                        errorMsg.innerText = "Email already in use. Try logging in.";
                    } else if(error.code === 'auth/weak-password') {
                        errorMsg.innerText = "Password is too weak. (Min. 6 characters)";
                    } else {
                        errorMsg.innerText = "Error: " + error.message;
                    }
                });
        });
    </script>
</body>
</html>
