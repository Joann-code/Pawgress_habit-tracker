<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Pawgress - Log In</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary-container": "#6c6864", "on-primary-fixed-variant": "#514535", "tertiary": "#615e59", "surface-container-lowest": "#ffffff", "on-tertiary": "#ffffff", "background": "#fff8f4", "tertiary-fixed": "#e7e2dc", "on-surface-variant": "#4d463e", "inverse-on-surface": "#f8efe9", "inverse-surface": "#34302c", "surface-container-low": "#fbf2ec", "on-surface": "#1f1b18", "secondary-fixed-dim": "#b9cbbb", "on-primary": "#ffffff", "on-secondary-fixed-variant": "#3a4b3e", "primary-fixed": "#f3dfca", "on-tertiary-fixed-variant": "#494642", "secondary-fixed": "#d4e7d6", "surface-tint": "#6a5c4b", "secondary-container": "#d4e7d6", "error": "#ba1a1a", "on-error-container": "#93000a", "on-tertiary-fixed": "#1d1b18", "outline-variant": "#d0c5ba", "primary-container": "#fbe7d1", "outline": "#7e766d", "error-container": "#ffdad6", "primary": "#6a5c4b", "on-secondary-fixed": "#0f1f14", "tertiary-fixed-dim": "#cbc6c0", "surface-container-highest": "#eae1db", "surface-container-high": "#efe6e1", "surface-container": "#f5ece6", "primary-fixed-dim": "#d6c4af", "inverse-primary": "#d6c4af", "on-primary-fixed": "#241a0d", "surface-variant": "#eae1db", "surface-bright": "#fff8f4", "on-background": "#1f1b18", "tertiary-container": "#efe9e3", "surface-dim": "#e1d8d3", "secondary": "#516255", "on-error": "#ffffff", "on-primary-container": "#756755", "surface": "#fff8f4", "on-secondary-container": "#57695b", "on-secondary": "#ffffff" }, fontFamily: { "body-lg": ["Plus Jakarta Sans"], "h2": ["Plus Jakarta Sans"], "h1": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "h3": ["Plus Jakarta Sans"], "label-caps": ["Plus Jakarta Sans"] } } } }
    </script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
    <main class="flex-grow flex items-center justify-center p-6 sm:p-12 relative overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container rounded-full mix-blend-multiply filter blur-[100px] opacity-40 pointer-events-none"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-container rounded-full mix-blend-multiply filter blur-[100px] opacity-40 pointer-events-none"></div>
        
        <div class="w-full max-w-[480px] bg-surface-container-lowest rounded-[32px] p-10 sm:p-14 pt-12 sm:pt-16 relative z-10 shadow-[0_40px_100px_-20px_rgba(106,92,75,0.08)] flex flex-col gap-10">
            <div class="absolute top-8 left-10 sm:left-14">
                <a class="inline-flex items-center gap-1.5 font-body-md text-on-surface-variant hover:text-primary transition-colors group" href="index.html">
                    <span class="material-symbols-outlined text-[20px] transition-transform group-hover:-translate-x-0.5">arrow_back</span>
                    <span class="font-medium">Back</span>
                </a>
            </div>
            
            <div class="flex flex-col items-center text-center gap-4">
                <div class="flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-low mb-2 text-primary">
                    <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">pets</span>
                </div>
                <h1 class="font-h2 text-h2 text-on-surface">Welcome back</h1>
                <p class="font-body-md text-body-md text-on-surface-variant max-w-[300px]">Log in to continue your journey with your pet.</p>
            </div>
            
            <form id="login-form" class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant ml-1 uppercase tracking-wider" for="email">Email</label>
                    <input class="w-full bg-surface-container-low border border-outline-variant/30 text-on-surface font-body-md text-body-md rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-300 placeholder:text-outline" id="email" required placeholder="Enter your email" type="email"/>
                </div>
                
                <div class="flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant ml-1 uppercase tracking-wider" for="password">Password</label>
                    <input class="w-full bg-surface-container-low border border-outline-variant/30 text-on-surface font-body-md text-body-md rounded-xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-300 placeholder:text-outline" id="password" required placeholder="Enter your password" type="password"/>
                </div>
                
                <p id="error-message" class="text-error text-sm hidden font-medium"></p>

                <div class="flex items-center justify-between mt-2">
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <div class="relative flex items-center justify-center">
                            <input class="peer appearance-none w-5 h-5 border-2 border-outline-variant rounded bg-transparent checked:bg-secondary checked:border-secondary transition-all cursor-pointer" type="checkbox"/>
                            <span class="material-symbols-outlined absolute text-on-secondary text-sm opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1; font-weight: 700;">check</span>
                        </div>
                        <span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
                    </label>
                    <a class="font-body-md text-body-md text-primary font-medium hover:text-surface-tint transition-colors hover:underline underline-offset-4 decoration-primary/30" href="#">Forgot password?</a>
                </div>
                
                <button id="submit-btn" class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-medium py-4 rounded-full mt-4 hover:bg-surface-tint transition-all duration-300 shadow-sm active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer" type="submit">
                    Log In
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
                </button>
            </form>
            
            <div class="pt-4 border-t border-outline-variant/20 text-center">
                <p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:text-surface-tint transition-colors ml-1 hover:underline underline-offset-4 decoration-primary/30" href="signup.html">Sign up</a>
                </p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoJaDoLgqK0mBqwFlR4IzfOXU5Momw79M",
            authDomain: "pawgress-61f1b.firebaseapp.com",
            projectId: "pawgress-61f1b",
            storageBucket: "pawgress-61f1b.firebasestorage.app",
            messagingSenderId: "961533964015",
            appId: "1:961533964015:web:e8ebc2c592bcf03def751a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            submitBtn.innerText = "Loading...";

            const email = emailInput.value;
            const password = passwordInput.value;

            // Fungsi Log In Firebase
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log("Logged in:", user.email);
                    
                    // Lempar ke Dashboard jika sukses
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    submitBtn.innerText = "Log In";
                    errorMsg.classList.remove('hidden');
                    
                    if(error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        errorMsg.innerText = "Invalid email or password.";
                    } else {
                        errorMsg.innerText = "Error: " + error.message;
                    }
                });
        });
    </script>
</body>
</html>
